# CI for homelab-public. Every job must pass before a change counts as done.
#
#   leak-guard   the same check as the pre-commit hook, run over every tracked file
#   gitleaks     generic secret scan over the full git history (push only)
#   python       ruff lint + pytest for Code/Python
#   powershell   PSScriptAnalyzer + Pester for Code/PowerShell, on Windows
#
# Hardening notes:
#   - Third-party actions are pinned to a full commit SHA, not a tag. A tag can be
#     moved to malicious code; a SHA cannot. Dependabot (.github/dependabot.yml)
#     proposes SHA updates weekly, and the comment after each pin says which version it is.
#   - The workflow token is read-only (permissions below), and checkout does not
#     leave credentials in .git/config (persist-credentials: false).
#   - Tool versions installed with pip / Install-Module are pinned so a new rule
#     release can't turn the build red without a commit here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # manual "Run workflow" button in the Actions tab

permissions:
  contents: read              # least privilege for GITHUB_TOKEN in every job

concurrency:                  # a newer push to the same ref cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files for private addressing, MACs, fingerprints and key material
        run: bash .githooks/leak-guard.sh --all

  gitleaks:
    # Push only: on pull requests the action wants to post comments, which needs a
    # write-scoped token. A solo repo gets the same coverage from the push run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # full history, so old commits are scanned too
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # no GITLEAKS_LICENSE needed on a personal account

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned lint and test tools
        run: python -m pip install ruff==0.16.8 pytest==9.1.1
      - name: ruff
        run: ruff check Code/Python tests
      - name: pytest
        run: python -m pytest -q tests

  powershell:
    runs-on: windows-latest     # Glas and Faire target Windows; tests run where the code runs
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned PSScriptAnalyzer and Pester
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -SkipPublisherCheck
      - name: PSScriptAnalyzer (Warning and Error)
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./Code/PowerShell -Recurse -Severity Warning, Error
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)" }
      - name: Pester
        run: |
          Import-Module Pester -RequiredVersion 5.9.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true              # non-zero exit code when any test fails
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
